# schematize-rust — workflow de CI de referência (§13, §21, a `schematize-qa`, §35).
# Copie para .github/workflows/ci.yml e ajuste <projeto>/comandos da sua stack.
#
# PISO 27 — CI remoto NÃO roda por commit (custo). O gate por commit é LOCAL (assets/hooks/.pre-commit-config.yaml
# + scripts/check-diff.sh --staged); os commits se acumulam. Este workflow roda só: (a) uma vez antes de promover
# para hml (tag `hml-*`), (b) em release (tag `v*`), (c) quando o usuário pedir (workflow_dispatch).
# VETADO `pull_request`/`pull_request_target` (qualquer filtro), `push` em branch, `workflow_run`, `merge_group`,
# cron sem justificativa. Não existe "check obrigatório no PR". Gate: check-ci-triggers.sh (job standards-gate).
name: ci
on:
  workflow_dispatch:
  push:
    tags: ["hml-*", "v*"]
    paths-ignore: ["**.md", "docs/**", "*_archive/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Gate de padrões (DoD/§37) no diff
        # Tag de promoção: diff desde a tag ANTERIOR (sem tag anterior: contra origin/main). Não há PR, então nada de
        # github.base_ref; e base==HEAD é bloqueada pelo próprio script (diff vazio = falso verde).
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo origin/main)"
          bash .claude/skills/schematize-rust/scripts/check-diff.sh "$PREV"
      - name: Índice de microfunções atualizado (§39)
        env:
          # Sem estes dois o gate NAO roda — e nao rodar REPROVA. Gate desarmado em silencio
          # ("|| true" + diff comentado) foi o achado A5 da vistoria de 2026-08-21.
          INDEX_SRC: ${{ vars.INDEX_SRC || './src' }}
          INDEX_FILE: ${{ vars.INDEX_FILE }}
        run: bash .claude/skills/schematize-rust/scripts/check-index.sh
      - name: Scan de segredo no archive (§16.1/§32)
        run: bash .claude/skills/schematize-rust/scripts/archive-secret-scan.sh .
      - name: Efeito externo não escapa de não-produção (§37, "Disparar efeito externo REAL a partir de não-produção")
        env:
          TEST_MAIL_DOMAIN: test.<domain>   # ajuste; o gate confere o null MX por dig
        run: bash .claude/skills/schematize-rust/scripts/check-external-effects.sh .
      - name: Deploy só do git (pisos 22/23) — sem scp/rsync/tar|ssh
        env:
          SKIP_GIT: "1"   # no CI o checkout é destacado; HEAD==origin vale local/overdev
        run: bash .claude/skills/schematize-engineering/scripts/check-deploy-git.sh .
      - name: Gatilhos de CI (piso 27) — nada de on:push em branch / pull_request / sem concurrency
        run: bash .claude/skills/schematize-engineering/scripts/check-ci-triggers.sh .
      - name: Resiliência do microserviço (piso 28) — OPCIONAL; ative com a variável RESILIENCE_DIRS (dirs com resilience.yml, separados por espaço)
        if: ${{ vars.RESILIENCE_DIRS != '' }}
        run: |
          for d in ${{ vars.RESILIENCE_DIRS }}; do
            bash .claude/skills/schematize-engineering/scripts/check-resilience.sh "$d"
          done

  rust-lint-test:
    runs-on: ubuntu-latest
    # SQLX_OFFLINE: build hermético a partir do .sqlx/ commitado (stack-rust.md §3) — sem Postgres para compilar.
    env: { CARGO_TERM_COLOR: always, RUSTFLAGS: "-D warnings", SQLX_OFFLINE: "true" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain fixada (rust-toolchain.toml) + componentes
        run: rustup show && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: clippy -D warnings (os lints restriction vêm de [lints] no Cargo.toml / clippy.toml — assets/lint/)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with: { tool: cargo-nextest }
      - name: cargo nextest (testes) + doctests
        run: cargo nextest run --workspace --locked && cargo test --workspace --doc --locked

  # Remova este job se o projeto não usa sqlx. Garante que o .sqlx/ commitado não envelheceu
  # (`prepare --check` precisa de um banco com o schema migrado).
  sqlx-prepare-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci-only, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env: { DATABASE_URL: "postgres://postgres:ci-only@localhost:5432/ci" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup show
      - run: cargo install --locked sqlx-cli --no-default-features --features rustls,postgres
      - run: sqlx migrate run && cargo sqlx prepare --workspace --check -- --all-targets

  # MSRV declarado (`rust-version` no Cargo.toml) tem que COMPILAR — senão é intenção, não garantia (stack-rust.md).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: cargo check na toolchain do MSRV
        run: |
          MSRV="$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version | select(. != null)] | sort_by(split(".") | map(tonumber)) | last // empty')"
          [ -n "$MSRV" ] || { echo "ERRO: sem rust-version no Cargo.toml (declare o MSRV)" >&2; exit 1; }
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" check --workspace --locked

  # miri onde há `unsafe` (stack-versoes.md). Sem `unsafe` no código, o job termina sem rodar o miri (e diz isso).
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: cargo miri test (só se houver unsafe)
        run: |
          if grep -rqE '\bunsafe\b' --include='*.rs' --exclude-dir=target .; then
            rustup toolchain install nightly --profile minimal --component miri
            cargo +nightly miri test --workspace
          else
            echo "sem unsafe: miri não se aplica"
          fi

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: cargo deny (advisories, licenças, bans, sources — assets/lint/deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check, arguments: --all-features }

  test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Smoke + security + authz + hardening (tag de promoção — a `schematize-qa` (gates de CI, `references/execucao.md` secao 6))
        run: |
          # LIGUE ao CLI do projeto. Enquanto o placeholder existir o passo REPROVA (verde de mentira é vetado).
          echo "ERRO: ligue o test kit do <projeto>_ops (smoke/security/authz/hardening) antes de usar este template" >&2
          exit 1
          # <projeto> test smoke && <projeto> test security && <projeto> test authz && <projeto> test hardening
      - name: Smoke self-check (anti verde-mentiroso — a `schematize-qa` (smoke e matriz simulated, `references/categorias.md` secoes 5 e 10))
        run: bash .claude/skills/schematize-rust/scripts/smoke-selfcheck.sh --self-check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: '1' }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
